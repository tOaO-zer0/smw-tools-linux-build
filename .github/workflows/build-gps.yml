name: Build GPS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            cmake \
            build-essential \
            gcc-multilib \
            g++-multilib \
            unzip

      - name: Build
        run: bash build-gps.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gps
          path: artifacts/gps/
          if-no-files-found: error
          retention-days: 30
