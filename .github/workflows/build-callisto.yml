name: Build Callisto

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            cmake \
            build-essential \
            wget \
            tar \
            libtbb-dev

      - name: Build Callisto
        run: bash build-callisto.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: callisto
          path: artifacts/callisto/
          if-no-files-found: error
          retention-days: 30
