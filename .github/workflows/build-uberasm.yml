name: Build UberASM

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build UberASM
        run: bash build-uberasm.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uberasm
          path: artifacts/uberasm/
          if-no-files-found: error
          retention-days: 30
